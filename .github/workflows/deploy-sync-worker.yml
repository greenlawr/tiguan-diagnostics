# Deploys the Evergreen sync server (sync-worker/) to Cloudflare whenever it
# changes on main. Needs the repository secret CLOUDFLARE_API_TOKEN (a token
# created in Cloudflare that can only deploy this one Worker). Until that
# secret exists, the job skips quietly instead of failing.
name: Deploy sync server
on:
  push:
    branches: [main]
    paths: ['sync-worker/**', '.github/workflows/deploy-sync-worker.yml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Waiting for the Cloudflare token
        if: env.CF_TOKEN == ''
        run: echo "CLOUDFLARE_API_TOKEN isn't set yet - skipping deploy."
      - uses: actions/checkout@v5
        if: env.CF_TOKEN != ''
      - name: Deploy to Cloudflare
        if: env.CF_TOKEN != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: sync-worker
          wranglerVersion: '4.167.0'
